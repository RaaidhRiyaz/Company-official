<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomit - Cyber Division</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png">
    
    <meta name="description" content="Lomit Cyber Division - Coming Soon.">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --bg-base: #030308;
            --text-main: #ffffff;
            --text-muted: #8a8a9a;
            --accent-purple: #a855f7;
            --accent-deep: #6b21a8;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: var(--font-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Fullscreen Swimming Canvas Background */
        #whale-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient background lighting and grid */
        .ambient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, rgba(3, 3, 8, 0.8) 75%);
        }

        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 36px 36px;
            z-index: 3;
            pointer-events: none;
        }

        .top-left-nav {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 20;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            background: rgba(15, 15, 22, 0.75);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 0.8rem 1.6rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-smooth);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .back-btn i {
            color: var(--accent-purple);
            transition: transform 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(25, 25, 38, 0.9);
            border-color: var(--accent-purple);
            color: #ffffff;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateX(-3px);
        }

        .back-btn:hover i {
            transform: translateX(-4px);
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 900px;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .coming-soon-title {
            font-size: clamp(3.2rem, 8.5vw, 7.5rem);
            font-weight: 900;
            line-height: 1.02;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 1.75rem;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(168, 85, 247, 0.35);
        }

        /* Company Logo container directly below the Coming Soon text */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.5rem;
            padding: 1.25rem 2.75rem;
            background: rgba(15, 15, 22, 0.5);
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: var(--transition-smooth);
        }

        .logo-container:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            transform: translateY(-3px);
        }

        .company-logo {
            height: 65px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.45));
        }

        .subtext {
            margin-top: 2.25rem;
            font-size: clamp(0.9rem, 1.6vw, 1.15rem);
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .top-left-nav {
                top: 1.25rem;
                left: 1.25rem;
            }

            .back-btn {
                padding: 0.65rem 1.25rem;
                font-size: 0.88rem;
            }

            .company-logo {
                height: 48px;
            }

            .logo-container {
                padding: 1rem 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background layers -->
    <canvas id="whale-canvas"></canvas>
    <div class="ambient-overlay"></div>
    <div class="grid-overlay"></div>

    <!-- Navigation -->
    <div class="top-left-nav">
        <button onclick="goBack()" class="back-btn" aria-label="Go back">
            <i class="fas fa-arrow-left"></i>
            <span>Back</span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="main-container">
        <div class="content-box">
            
            <h1 class="coming-soon-title">Coming Soon</h1>
            
            
                <a href="Home.html" aria-label="Lomit Home">
                    <img src="Logo.png" alt="Lomit Logo" class="company-logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'180\' height=\'50\' viewBox=\'0 0 180 50\'><text x=\'50%\' y=\'65%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23ffffff\' font-family=\'sans-serif\' font-size=\'32\' font-weight=\'bold\' letter-spacing=\'2\'>LOMIT</text></svg>'">
                </a>
            </div>



        </div>
    </main>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        /* Interactive Canvas Swimming Purple Whale Logic */
        const canvas = document.getElementById('whale-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        /* Floating background bioluminescent bubbles/particles */
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = -Math.random() * 0.4 - 0.1;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha += Math.sin(Date.now() * this.pulse) * 0.005;

                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset();
                    this.y = height + 10;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(168, 85, 247, ${Math.max(0.05, Math.min(0.7, this.alpha))})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#a855f7';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /* Procedural Swimming Whale Implementation */
        class SwimmingWhale {
            constructor() {
                this.numSegments = 22;
                this.segmentLength = 16;
                this.segments = [];
                
                // Position and motion trajectory
                this.head = { x: width * 0.2, y: height * 0.5 };
                this.angle = 0;
                this.targetAngle = 0;
                this.speed = 1.8;
                
                this.time = 0;
                this.tailWave = 0;

                // Path points for autonomous curved swimming loop
                this.pathPhase = 0;

                // Initialize spine segment positions
                for (let i = 0; i < this.numSegments; i++) {
                    this.segments.push({
                        x: this.head.x - i * this.segmentLength,
                        y: this.head.y,
                        angle: 0
                    });
                }

                // Bioluminescent tail particles
                this.trailParticles = [];
            }

            update() {
                this.time += 0.025;
                this.pathPhase += 0.006;

                // Smooth figure-8 / curving trajectory across the screen
                const targetX = width * 0.5 + Math.sin(this.pathPhase) * (width * 0.38);
                const targetY = height * 0.5 + Math.sin(this.pathPhase * 2) * (height * 0.28);

                const dx = targetX - this.head.x;
                const dy = targetY - this.head.y;
                
                this.targetAngle = Math.atan2(dy, dx);

                // Smoothly rotate head angle
                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * 0.03;

                // Move head forward
                this.head.x += Math.cos(this.angle) * this.speed;
                this.head.y += Math.sin(this.angle) * this.speed;

                // First segment follows head
                this.segments[0].x = this.head.x;
                this.segments[0].y = this.head.y;
                this.segments[0].angle = this.angle;

                // Sine wave oscillation propagation down the spine
                for (let i = 1; i < this.numSegments; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];

                    const waveOffset = Math.sin(this.time * 2.5 - i * 0.28) * (i * 0.22);
                    const angleToPrev = Math.atan2(prev.y - curr.y, prev.x - curr.x);
                    
                    curr.angle = angleToPrev;
                    curr.x = prev.x - Math.cos(angleToPrev + waveOffset * 0.05) * this.segmentLength;
                    curr.y = prev.y - Math.sin(angleToPrev + waveOffset * 0.05) * this.segmentLength;
                }

                // Emit bioluminescent trail from tail fluke
                const tailIndex = this.numSegments - 1;
                if (Math.random() < 0.6) {
                    this.trailParticles.push({
                        x: this.segments[tailIndex].x + (Math.random() - 0.5) * 10,
                        y: this.segments[tailIndex].y + (Math.random() - 0.5) * 10,
                        size: Math.random() * 3 + 1,
                        alpha: 0.8,
                        life: 1
                    });
                }

                // Update tail particles
                for (let i = this.trailParticles.length - 1; i >= 0; i--) {
                    const p = this.trailParticles[i];
                    p.alpha -= 0.015;
                    p.size *= 0.98;
                    if (p.alpha <= 0) {
                        this.trailParticles.splice(i, 1);
                    }
                }
            }

            drawTrail() {
                for (let p of this.trailParticles) {
                    ctx.save();
                    ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#a855f7';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            draw() {
                this.drawTrail();

                ctx.save();

                // Outer bioluminescent ambient glow around the whale body
                ctx.shadowBlur = 35;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.75)';

                // Draw Pectoral Fins (attached around segment 4)
                if (this.segments.length > 5) {
                    const finSeg = this.segments[4];
                    const finAngle = finSeg.angle;

                    // Left Fin
                    ctx.save();
                    ctx.translate(finSeg.x, finSeg.y);
                    ctx.rotate(finAngle - Math.PI / 2.3 + Math.sin(this.time * 2) * 0.1);
                    const finGrad1 = ctx.createLinearGradient(0, 0, 55, 25);
                    finGrad1.addColorStop(0, 'rgba(168, 85, 247, 0.8)');
                    finGrad1.addColorStop(1, 'rgba(107, 33, 168, 0.1)');
                    ctx.fillStyle = finGrad1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(30, 15, 60, 35);
                    ctx.quadraticCurveTo(20, 35, 0, 0);
                    ctx.fill();
                    ctx.restore();

                    // Right Fin
                    ctx.save();
                    ctx.translate(finSeg.x, finSeg.y);
                    ctx.rotate(finAngle + Math.PI / 2.3 - Math.sin(this.time * 2) * 0.1);
                    const finGrad2 = ctx.createLinearGradient(0, 0, 55, -25);
                    finGrad2.addColorStop(0, 'rgba(168, 85, 247, 0.8)');
                    finGrad2.addColorStop(1, 'rgba(107, 33, 168, 0.1)');
                    ctx.fillStyle = finGrad2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(30, -15, 60, -35);
                    ctx.quadraticCurveTo(20, -35, 0, 0);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Whale Body Silhouette using Smooth Spine Nodes
                ctx.beginPath();

                // Compute left and right boundary profile points along the spine
                const leftSide = [];
                const rightSide = [];

                // Body thickness curve profile (head -> mid torso -> narrow tail stem)
                const getRadius = (index) => {
                    const norm = index / this.numSegments;
                    if (norm < 0.15) return 14 + norm * 110; // Head dome expansion
                    if (norm < 0.5) return 30 - (norm - 0.15) * 35; // Tapering torso
                    if (norm < 0.85) return 18 - (norm - 0.5) * 32; // Lower body
                    return 7 - (norm - 0.85) * 12; // Tail stem
                };

                for (let i = 0; i < this.numSegments; i++) {
                    const seg = this.segments[i];
                    const r = getRadius(i);
                    const normalAngle = seg.angle + Math.PI / 2;

                    leftSide.push({
                        x: seg.x + Math.cos(normalAngle) * r,
                        y: seg.y + Math.sin(normalAngle) * r
                    });

                    rightSide.push({
                        x: seg.x - Math.cos(normalAngle) * r,
                        y: seg.y - Math.sin(normalAngle) * r
                    });
                }

                // Trace smooth contour around the whale body
                ctx.moveTo(leftSide[0].x, leftSide[0].y);
                
                for (let i = 1; i < leftSide.length; i++) {
                    ctx.lineTo(leftSide[i].x, leftSide[i].y);
                }

                // Connect to tail fluke joint
                const tailSeg = this.segments[this.numSegments - 1];
                ctx.lineTo(tailSeg.x, tailSeg.y);

                for (let i = rightSide.length - 1; i >= 0; i--) {
                    ctx.lineTo(rightSide[i].x, rightSide[i].y);
                }

                ctx.closePath();

                // Rich Purple Gradient Body Fill
                const bodyGradient = ctx.createRadialGradient(
                    this.head.x, this.head.y, 10,
                    this.head.x, this.head.y, 220
                );
                bodyGradient.addColorStop(0, 'rgba(216, 180, 254, 0.95)');
                bodyGradient.addColorStop(0.35, 'rgba(168, 85, 247, 0.85)');
                bodyGradient.addColorStop(0.7, 'rgba(124, 58, 237, 0.6)');
                bodyGradient.addColorStop(1, 'rgba(59, 7, 100, 0.35)');

                ctx.fillStyle = bodyGradient;
                ctx.fill();

                // Outline accent line
                ctx.strokeStyle = 'rgba(233, 213, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw Tail Fluke (Large graceful rear fin)
                ctx.save();
                ctx.translate(tailSeg.x, tailSeg.y);
                ctx.rotate(tailSeg.angle);

                const flukeGrad = ctx.createLinearGradient(0, -35, -45, 35);
                flukeGrad.addColorStop(0, 'rgba(192, 132, 252, 0.9)');
                flukeGrad.addColorStop(0.5, 'rgba(147, 51, 234, 0.7)');
                flukeGrad.addColorStop(1, 'rgba(88, 28, 135, 0.3)');

                ctx.fillStyle = flukeGrad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-20, -35, -45, -42);
                ctx.quadraticCurveTo(-30, -10, -10, 0);
                ctx.quadraticCurveTo(-30, 10, -45, 42);
                ctx.quadraticCurveTo(-20, 35, 0, 0);
                ctx.fill();
                ctx.restore();

                // Bioluminescent dorsal spots along spine
                for (let i = 2; i < this.numSegments - 3; i += 2) {
                    const seg = this.segments[i];
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, 2.2 - (i / this.numSegments) * 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Initialize particles & whale instance
        const particles = Array.from({ length: 45 }, () => new Particle());
        const whale = new SwimmingWhale();

        // Main Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Render particles
            for (let particle of particles) {
                particle.update();
                particle.draw();
            }

            // Update & Render Whale
            whale.update();
            whale.draw();

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
