<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon-16x16.png">
    <title>Lomit · Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s;
        }

        body.light-mode {
            --bg: #ffffff;
            --surface: rgba(255, 255, 255, 0.7);
            --text: #1a1a2e;
            --text-light: #2d2d44;
            --purple: #5a4fcf;
            --purple-light: #7b6ef0;
            --border: rgba(90, 79, 207, 0.2);
            --card-bg: rgba(255, 255, 255, 0.6);
            --shadow: 0 20px 35px -8px rgba(90, 79, 207, 0.15);
            --footer-bg: #f8faff;
            --input-bg: rgba(255, 255, 255, 0.8);
        }

        body.dark-mode {
            --bg: #0c0c1a;
            --surface: rgba(18, 18, 30, 0.8);
            --text: #f0f0fa;
            --text-light: #c2c2e0;
            --purple: #8f7aff;
            --purple-light: #a99bff;
            --border: rgba(143, 122, 255, 0.25);
            --card-bg: rgba(25, 25, 45, 0.7);
            --shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.6);
            --footer-bg: #080812;
            --input-bg: rgba(30, 30, 50, 0.9);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 2rem;
            box-shadow: var(--shadow);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        /* Navbar */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo img {
            height: 42px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
            letter-spacing: -0.01em;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--purple);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--purple);
            display: flex;
            align-items: center;
            padding: 0.4rem;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        #theme-toggle:hover {
            transform: scale(1.05);
            color: var(--purple-light);
        }

        .hamburger {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: var(--purple);
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .hamburger {
                display: block;
                order: 2;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                gap: 1rem;
                padding: 1.5rem 0;
                align-items: center;
                background: var(--card-bg);
                backdrop-filter: blur(16px);
                border-radius: 2rem;
                border: 1px solid var(--border);
                margin-top: 0.5rem;
            }
            .nav-links.show {
                display: flex;
            }
        }

        /* Page header */
        .page-header {
            padding: 3rem 0 1rem;
        }
        .page-header h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .page-header .purple {
            color: var(--purple);
        }

        /* Contact grid */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin: 4rem 0;
        }

        /* Contact info cards */
        .info-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 2.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .info-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--purple);
            margin-bottom: 1.5rem;
        }
        .contact-detail {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .contact-detail i {
            font-size: 1.8rem;
            color: var(--purple);
            width: 2rem;
            text-align: center;
        }
        .contact-detail a, .contact-detail span {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            word-break: break-word;
        }
        .contact-detail a:hover {
            color: var(--purple);
        }

        /* Map container */
        .map-container {
            border-radius: 2rem;
            overflow: hidden;
            border: 2px solid var(--border);
            height: 250px;
            width: 100%;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Social links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .social-links a {
            color: var(--text-light);
            font-size: 1.8rem;
            transition: color 0.2s;
        }
        .social-links a:hover {
            color: var(--purple);
        }

        /* Formspree form */
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 2.5rem;
            padding: 2.5rem;
        }
        .form-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--purple);
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            font-size: 1rem;
            color: var(--text);
            transition: 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(90, 79, 207, 0.2);
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .submit-btn {
            background: var(--purple);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            border: 1px solid var(--purple-light);
        }
        .submit-btn:hover {
            background: var(--purple-light);
            transform: translateY(-2px);
        }
        .form-note {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
            text-align: center;
        }

        /* CTA */
        .cta-section {
            text-align: center;
            margin: 4rem 0;
        }
        .cta-button {
            display: inline-block;
            background: var(--purple);
            color: white;
            padding: 1rem 2.8rem;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--purple-light);
            transition: 0.2s;
            box-shadow: 0 8px 18px rgba(90, 79, 207, 0.25);
            font-size: 1.2rem;
        }
        .cta-button:hover {
            background: var(--purple-light);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            margin-top: 5rem;
            padding: 2rem 0;
            background: var(--footer-bg);
            border-top: 1px solid var(--border);
        }
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer-content p {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        .footer-links {
            display: flex;
            gap: 1.8rem;
        }
        .footer-links a {
            color: var(--text-light);
            font-size: 1.3rem;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: var(--purple);
        }

        /* Floating WhatsApp */
        .wa-float {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #25D366;
            color: white;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            transition: 0.2s;
            z-index: 99;
            text-decoration: none;
            border: 2px solid white;
        }
        .wa-float:hover {
            transform: scale(1.1);
            background: #20b859;
        }

        @media (max-width: 900px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
        @media (max-width: 600px) {
            .page-header h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body class="light-mode">

            <p>© 2025 Lomit. All rights reserved. — Sri Lanka</p>

                <a href="#" aria-label="Email"><i class="far fa-envelope"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-toggle');
            const icon = themeBtn.querySelector('i');
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');

            // Theme
            const savedTheme = localStorage.getItem('lomitTheme');
            if (savedTheme) {
                body.className = savedTheme;
                updateIcon(savedTheme);
            } else {
                body.className = 'light-mode';
                updateIcon('light-mode');
            }

            function updateIcon(theme) {
                icon.className = theme === 'light-mode' ? 'fas fa-sun' : 'fas fa-moon';
            }

            themeBtn.addEventListener('click', () => {
                if (body.classList.contains('light-mode')) {
                    body.classList.replace('light-mode', 'dark-mode');
                    localStorage.setItem('lomitTheme', 'dark-mode');
                    updateIcon('dark-mode');
                } else {
                    body.classList.replace('dark-mode', 'light-mode');
                    localStorage.setItem('lomitTheme', 'light-mode');
                    updateIcon('light-mode');
                }
            });

            // Mobile menu
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('show');
                });
            });
        })();
    </script>
    <!-- Replace placeholder logo and Formspree action URL -->
</body>
</html>
